name: OTA update

# Every merge to main ships its JavaScript to testers over the air: installed
# builds on the `production` channel download it on launch and run it on the
# next launch. No Play upload, no new build.
#
# Safe by construction: `runtimeVersion.policy` is `fingerprint` (app.json), so
# an update is only offered to builds whose native code matches the commit it
# was made from. A merge that changes native code (a new Expo module, a config
# plugin, app.json native fields, the app icons) publishes an update no
# installed build will take — so when no Android production build exists for
# the new fingerprint, this workflow also starts one and auto-submits it to
# Play's internal track. See docs/RELEASES.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ota-production
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Same gate as CI: never push a red commit to people's phones.
      - run: npm run lint
      - run: npm run type-check
      - run: npm test

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # `--environment production` pulls EXPO_PUBLIC_* from EAS, as builds do.
      # The commit subject is passed through env, never spliced into the script.
      - env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          MESSAGE="$(printf '%s' "${COMMIT_MESSAGE:-manual run}" | head -n 1)"
          eas update \
            --channel production \
            --environment production \
            --message "$MESSAGE" \
            --non-interactive

      # Native code changed (new fingerprint, no build for it yet): build the
      # Android AAB and auto-submit it to Play's internal track, so testers get
      # it from Play with no manual step. Errored or canceled builds don't
      # count, so a failed build is retried by the next merge. `--no-wait`
      # leaves the runner once the build is queued; EAS builds and submits.
      - name: Android build when native code changed
        run: |
          set -euo pipefail
          HASH="$(eas fingerprint:generate --platform android --build-profile production --json --non-interactive | jq -r '.hash')"
          echo "Android fingerprint: $HASH"
          EXISTING="$(eas build:list --platform android --build-profile production \
            --fingerprint-hash "$HASH" --limit 50 --json --non-interactive \
            | jq '[.[] | select(.status != "ERRORED" and .status != "CANCELED")] | length')"
          if [ "$EXISTING" -gt 0 ]; then
            echo "A production build already has this fingerprint — the OTA update above reaches it."
            exit 0
          fi
          echo "No production build has this fingerprint — building and submitting to Play internal."
          eas build --profile production --platform android --auto-submit --non-interactive --no-wait
