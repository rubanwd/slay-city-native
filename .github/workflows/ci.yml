name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, so drift introduced by an upstream merge surfaces the next morning
    # rather than at the next pull request — which could be weeks away.
    - cron: "0 4 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run type-check
      - run: npm test

  upstream-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the upstream web app
        uses: actions/checkout@v4
        with:
          repository: rubanwd/slay-city
          path: upstream
          token: ${{ secrets.UPSTREAM_READ_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No npm ci — the drift check has no dependencies beyond Node itself, so it
      # still reports on a morning when the install step is broken.
      - run: node scripts/check-upstream-drift.mjs --upstream ./upstream
