name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, so drift introduced by an upstream merge surfaces the next morning
    # rather than at the next pull request — which could be weeks away.
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom 30 / undici 8 need Node ^22.22.2 or >=24.15 — on 20 every
          # jsdom test worker dies with `markAsUncloneable is not a function`.
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run type-check
      - run: npm test

  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # rubanwd/slay-city is private, so the plain clone in upstream:fetch has no
      # credentials here. UPSTREAM_TOKEN is a fine-grained PAT with read-only
      # Contents access to that one repository (docs/SYNC.md section 2).
      - uses: actions/checkout@v4
        with:
          repository: rubanwd/slay-city
          path: upstream
          token: ${{ secrets.UPSTREAM_TOKEN }}

      - name: Check upstream drift
        id: drift
        run: npm run drift:check > drift-output.txt 2>&1
        continue-on-error: true

      - name: Publish drift summary
        if: always()
        run: |
          {
            echo "## Upstream drift check"
            echo
            if [ "${{ steps.drift.outcome }}" = "success" ]; then
              echo "✅ All tracked files are in sync with upstream."
            else
              echo "❌ Drift detected — a tracked file no longer matches upstream."
            fi
            echo
            echo '```'
            cat drift-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the job if drift was found
        if: steps.drift.outcome == 'failure'
        run: |
          echo "Upstream drift detected — see the step summary for details, or docs/SYNC.md section 4 to resolve it."
          exit 1
